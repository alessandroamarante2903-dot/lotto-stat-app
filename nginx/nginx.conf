# =====================================================================
# nginx/nginx.conf — porta d'ingresso unica dello stack (lotto_stat_proxy)
#
#   /            -> lotto_stat_web (Streamlit, con supporto WebSocket)
#   /grafana/    -> lotto_stat_grafana
#   /api/        -> lotto_stat_backend (FastAPI, con /api/ tagliato via rewrite)
#
# Predisposto per HTTPS: aggiungere un secondo server block su
# "listen 443 ssl;" con ssl_certificate/ssl_certificate_key montati da
# volume, e un redirect 80->443 nel server block esistente, quando sarà
# disponibile un certificato per il dominio di destinazione.
# =====================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    # Necessario per il proxy dei WebSocket di Streamlit (comunicazione
    # bidirezionale usata per aggiornare la UI senza ricaricare la pagina).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream streamlit_backend {
        server web:8501;
    }

    upstream grafana_backend {
        server grafana:3000;
    }

    upstream fastapi_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # --- Grafana -----------------------------------------------------
        # GF_SERVER_SERVE_FROM_SUB_PATH=true (vedi podman-compose.yml) fa sì
        # che Grafana stesso generi già i link con il prefisso /grafana/,
        # quindi qui il path va inoltrato invariato (nessun rewrite).
        location /grafana/ {
            proxy_pass http://grafana_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket dedicato di Grafana (live dashboard updates).
        location /grafana/api/live/ {
            proxy_pass http://grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # --- API FastAPI ---------------------------------------------------
        # Rewrite: FastAPI (backend/main.py) definisce le route senza
        # prefisso (es. "/health", "/lotto/ritardatari"), quindi "/api/"
        # va tagliato prima di inoltrare la richiesta.
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Streamlit -----------------------------------------------------
        location / {
            proxy_pass http://streamlit_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Le sessioni Streamlit restano aperte a lungo tramite WebSocket:
            # un timeout troppo corto le farebbe cadere a metà utilizzo.
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
